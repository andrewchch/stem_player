<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stem Player</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 2rem;
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin-bottom: 1rem;
      }
      .controls {
        margin: 1rem 0;
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      #playback-seek {
        flex: 1 1 240px;
        min-width: 180px;
      }
      .stem {
        border: 1px solid #ccc;
        border-radius: 0.5rem;
        padding: 0.75rem;
        margin: 0.5rem 0;
      }
      .stem-row {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      .stem-name {
        width: 220px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #status {
        margin: 0.5rem 0;
        color: #555;
        min-height: 1.2em;
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      #playback-summary {
        font-family: monospace;
        font-size: 1rem;
        color: #333;
        min-width: 11ch;
        display: inline-block;
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <h1 style="margin:0">Stem Player</h1>
      <a href="/admin"><button type="button">Admin</button></a>
    </div>

    <div style="margin-bottom:1rem">
      <label for="folder-select"><strong>Project folder:</strong></label>
      <select id="folder-select">
        <option value="">— select a folder —</option>
      </select>
    </div>

    <div class="controls">
      <button id="play-all" type="button">Play</button>
      <button id="pause-all" type="button">Pause</button>
      <button id="stop-all" type="button">Stop</button>
      <input
        id="playback-seek"
        type="range"
        min="0"
        max="0"
        step="0.01"
        value="0"
        disabled
        aria-label="Playback position"
      />
      <span id="playback-summary">00:00 / 00:00</span>
    </div>

    <div id="status"></div>
    <div id="stems"></div>

    <script>
      const stemsContainer = document.getElementById("stems");
      const statusEl = document.getElementById("status");
      const folderSelect = document.getElementById("folder-select");
      const playBtn = document.getElementById("play-all");
      const pauseBtn = document.getElementById("pause-all");
      const stopBtn = document.getElementById("stop-all");
      const seekEl = document.getElementById("playback-seek");
      const summaryEl = document.getElementById("playback-summary");
      const players = [];

      // Track current playback state: 'stopped' | 'playing' | 'paused'
      let playState = "stopped";
      let summaryInterval = null;

      function formatTime(seconds) {
        if (!isFinite(seconds) || seconds < 0) seconds = 0;
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
      }

      function getTotalDuration() {
        if (players.length === 0) return 0;
        return Math.max(...players.map((p) => p.audio.duration || 0));
      }

      function getCurrentTime() {
        if (players.length === 0) return 0;
        return players[0].audio.currentTime || 0;
      }

      function syncSeekBar() {
        const duration = getTotalDuration();
        const currentTime = Math.min(getCurrentTime(), duration || 0);
        seekEl.max = String(duration || 0);
        seekEl.value = String(currentTime);
        seekEl.disabled = players.length === 0 || duration <= 0;
      }

      function updateSummary() {
        summaryEl.textContent = formatTime(getCurrentTime()) + " / " + formatTime(getTotalDuration());
        syncSeekBar();
      }

      function startSummaryUpdates() {
        stopSummaryUpdates();
        summaryInterval = setInterval(updateSummary, 100);
      }

      function stopSummaryUpdates() {
        if (summaryInterval !== null) {
          clearInterval(summaryInterval);
          summaryInterval = null;
        }
      }

      function resetSummary() {
        stopSummaryUpdates();
        summaryEl.textContent = "00:00 / " + formatTime(getTotalDuration());
        syncSeekBar();
      }

      function setStatus(message) {
        statusEl.textContent = message;
      }

      function updateControls() {
        if (playState === "stopped") {
          playBtn.disabled = players.length === 0;
          pauseBtn.disabled = true;
          stopBtn.disabled = true;
          pauseBtn.textContent = "Pause";
        } else if (playState === "playing") {
          playBtn.disabled = true;
          pauseBtn.disabled = false;
          stopBtn.disabled = false;
          pauseBtn.textContent = "Pause";
        } else if (playState === "paused") {
          playBtn.disabled = true;
          pauseBtn.disabled = false;
          stopBtn.disabled = false;
          pauseBtn.textContent = "Resume";
        }
        seekEl.disabled = players.length === 0 || getTotalDuration() <= 0;
      }

      function seekTo(time) {
        const duration = getTotalDuration();
        const targetTime = Math.max(0, Math.min(time, duration || 0));
        players.forEach((player) => {
          const playerDuration = player.audio.duration;
          if (isFinite(playerDuration) && playerDuration > 0) {
            player.audio.currentTime = Math.min(targetTime, playerDuration);
          } else {
            player.audio.currentTime = targetTime;
          }
        });
        updateSummary();
      }

      function applyMixState() {
        const hasSolo = players.some((p) => p.solo.checked);
        players.forEach((player) => {
          const volume = Number(player.volume.value);
          const mutedBySolo = hasSolo && !player.solo.checked;
          player.audio.volume = volume;
          player.audio.muted = player.mute.checked || mutedBySolo;
        });
      }

      async function loadFolders() {
        const response = await fetch("/api/folders");
        const folders = await response.json();
        while (folderSelect.options.length > 1) folderSelect.remove(1);
        folders.forEach((name) => {
          const opt = document.createElement("option");
          opt.value = name;
          opt.textContent = name;
          folderSelect.append(opt);
        });
      }

      async function loadStems() {
        const folder = folderSelect.value;
        const url = folder ? `/api/stems?folder=${encodeURIComponent(folder)}` : "/api/stems";

        // Stop any current playback and reset state before loading
        players.forEach((player) => {
          player.audio.pause();
          player.audio.currentTime = 0;
        });
        players.length = 0;
        stemsContainer.innerHTML = "";
        playState = "stopped";
        resetSummary();
        setStatus("Loading…");
        updateControls();

        const response = await fetch(url);
        const data = await response.json();

        if (!response.ok) {
          setStatus(data.error || "Failed to load stems");
          updateControls();
          return;
        }

        const stems = data;

        if (stems.length === 0) {
          stemsContainer.textContent = folder
            ? "No audio files in this folder yet."
            : "No stems uploaded yet.";
          setStatus("");
          updateControls();
          return;
        }

        stems.forEach((stem) => {
          const audio = new Audio(stem.url);
          audio.preload = "auto";

          const wrapper = document.createElement("div");
          wrapper.className = "stem";

          const row = document.createElement("div");
          row.className = "stem-row";

          const name = document.createElement("span");
          name.className = "stem-name";
          name.textContent = stem.name;

          const mute = document.createElement("input");
          mute.type = "checkbox";
          const muteLabel = document.createElement("label");
          muteLabel.append("Mute ", mute);

          const solo = document.createElement("input");
          solo.type = "checkbox";
          const soloLabel = document.createElement("label");
          soloLabel.append("Solo ", solo);

          const volume = document.createElement("input");
          volume.type = "range";
          volume.min = "0";
          volume.max = "1";
          volume.step = "0.01";
          volume.value = "1";

          [mute, solo, volume].forEach((el) =>
            el.addEventListener("input", applyMixState)
          );

          row.append(name, muteLabel, soloLabel, volume);
          wrapper.append(row);
          stemsContainer.append(wrapper);

          players.push({ audio, mute, solo, volume });
          audio.addEventListener("ended", onAudioEnded);
          audio.addEventListener("loadedmetadata", updateSummary);
        });

        applyMixState();
        updateSummary();
        setStatus(`${stems.length} file${stems.length !== 1 ? "s" : ""} loaded.`);
        updateControls();
      }

      folderSelect.addEventListener("change", () => {
        loadStems().catch(() => setStatus("Failed to load stems"));
      });

      seekEl.addEventListener("input", () => {
        seekTo(Number(seekEl.value));
      });

      playBtn.addEventListener("click", async () => {
        if (players.length === 0) return;
        setStatus("Loading audio…");
        playBtn.disabled = true;

        // Wait for all audio to be ready enough to play
        await Promise.all(
          players.map(
            (p) =>
              new Promise((resolve) => {
                if (p.audio.readyState >= 3) {
                  resolve();
                } else {
                  p.audio.addEventListener("canplay", resolve, { once: true });
                }
              })
          )
        );

        const minTime = Math.min(...players.map((p) => p.audio.currentTime), 0);
        for (const player of players) {
          player.audio.currentTime = minTime;
          await player.audio.play();
        }
        playState = "playing";
        startSummaryUpdates();
        setStatus("");
        updateControls();
      });

      pauseBtn.addEventListener("click", () => {
        if (playState === "playing") {
          players.forEach((player) => player.audio.pause());
          stopSummaryUpdates();
          updateSummary();
          playState = "paused";
        } else if (playState === "paused") {
          players.forEach((player) => player.audio.play());
          startSummaryUpdates();
          playState = "playing";
        }
        updateControls();
      });

      stopBtn.addEventListener("click", () => {
        players.forEach((player) => {
          player.audio.pause();
          player.audio.currentTime = 0;
        });
        playState = "stopped";
        resetSummary();
        updateControls();
      });

      // Detect when all audio ends naturally
      function onAudioEnded() {
        const allEnded = players.every((p) => p.audio.ended || p.audio.paused);
        if (allEnded) {
          playState = "stopped";
          stopSummaryUpdates();
          updateSummary();
          updateControls();
        }
      }

      (async () => {
        updateControls();
        await loadFolders();
        await loadStems();
      })().catch(() => setStatus("Failed to load"));
    </script>
  </body>
</html>
